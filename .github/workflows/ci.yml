name: CI
on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
      
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_USER: runner
                    POSTGRES_DB: supernova_bnb_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d supernova_bnb_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set Up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                playwright install

            - name: Run tests
              run: |
                python -m pytest
