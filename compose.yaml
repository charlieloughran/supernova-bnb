name: supernova_bnb

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: supernova_bnb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seeds/users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./seeds/spaces.sql:/docker-entrypoint-initdb.d/02-spaces.sql:ro
      - ./seeds/bookings.sql:/docker-entrypoint-initdb.d/03-bookings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: supernova-bnb:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
