<!DOCTYPE html>
<html>
    <head>
        <title>SupernovaBnB - Add a Space</title>
        {% include "components/import_stylesheets.html" %}
        <link rel="stylesheet" href="/static/style.css" >
    </head>
    <body>
        {% include "components/nav.html" %}
        <div class="container">
            <div class="back-link actions">
                <a href="/my_spaces" class="btn btn-outline">Back to My Spaces</a>
            </div>

        <h2>Add a  Space</h2>
        <form action="/my_spaces/new" method="POST" class="form" enctype="multipart/form-data" id="add-space">

                <label for="space-name">Name</label>
                <input id="space-name" name="space-name" type="text" placeholder="Enter Name of Space">

                <label for="space-description">Description</label>
                <textarea id="space-description" name="space-description" rows="5" placeholder="Enter Description"></textarea>

                <label for="availability-start-date">Available From</label>
                <input id="availability-start-date"  name="availability-start-date" type="date">

                <label for="availability-end-date">Available To</label>
                <input id="availability-end-date" name="availability-end-date" type="date">

                <label for="price-per-night">Price (per night)</label>
                <div class="input-with-symbol">
                    <span class="currency-symbol">£</span>
                    <input type="number" id="price_per_night" name="price_per_night">
                </div>
                
                <label for="image-url">Upload Image of Space</label>
                <input id="image-url" name="image-url" type="file">

                <button type="submit" class="btn btn-primary">Submit</button>

            </form>
        </div>
        {% include "components/footer.html" %}
    </body>
</html>
