<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupernovaBNB - My Bookings</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% from 'components/booking_card.html' import booking_card %}
    {% include "components/nav.html" %}
    <h2>My bookings</h2>
    <div class="booking_grid">
        {% for booking in bookings %}
            {{ booking_card(booking, spaces_by_id[booking.space_id]) }}
        {% else %}
            <p class="no-bookings-message">You have no bookings yet.</p>
            <a href="/">Browse spaces</a>
        {% endfor %}
    </div>
</body>
</html>
