<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupernovaBNB - My Bookings</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "components/nav.html" %}
    <h2>My bookings</h2>
    {% for booking in bookings %}
    <article class="booking-card">
        <h3 class="booking-space-name"> {{spaces_by_id[booking.space_id].name }}</h3>
        <p class="booking-date">{{ booking.date }}</p>
        <p class="booking-status">{{ booking.status }}</p>
        <p class="booking-price-per-night"> {{ spaces_by_id[booking.space_id].price_per_night }}</p>
        <a href="/spaces/{{ booking.space_id }}">View space</a>
    </article>
    {% endfor %}
</body>
</html>
