{% macro space_card(space) %}
<article class="card">
    <img src="{{ space.image_url }}" alt="image of the location">
    <div class="card-body">
        <h3>{{ space.name }}</h3>
        <p>£{{space.price_per_night}}</p>
        <p>{{space.description}}</p>
    </div>
    <div class="card-footer">
    <a href="/spaces/{{space.id}}" class="btn btn-primary">View Space</a>
    </div>
</article>
{% endmacro %}
