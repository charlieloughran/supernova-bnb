{% macro space_card(space) %}
<article class="space_card_container">
    <img src="{{ space.image_url }}" alt="image of the location">
    <div class="space_card_header">
        <h3>{{ space.name }}</h3>
        <p>£{{space.price_per_night}}</p>
    </div>
    <p class="space_card_description">{{space.description}}</p>
    <form action="/spaces/{{space.id}}" method="get">
        <input type="hidden" name="space_id" value="{{space.id}}">
        <button type="submit" class="btn-secondary">View Space</button>
    </form>
</article>
{% endmacro %}
