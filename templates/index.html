<!DOCTYPE html>
<html>

<head>
    <title>MakersBnB</title>

    <!--
            Head to https://github.com/makersacademy/web-applications-in-python/blob/main/pills/loading_css_or_static_files.md
            If you're wondering how the CSS file below is being loaded.
        -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    {% from 'components/space_card.html' import space_card %}
    {% include "components/nav.html" %}
    {% if session.get('username') %}
        <h1 style="font-weight: 300; margin-left: 80px;">Welcome {{ session['username'] }}</h1>
    {% else %}
        <h1 style="font-weight: 300; margin-left: 80px;">Welcome Guest</h1>
    {% endif %}
    <section class="space_card_section">
        <h2>Location 1</h2>
        {% for space in spaces %}
        {{space_card(space)}}
        {% endfor %}
    </section>
</body>

</html>
