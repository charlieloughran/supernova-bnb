<html>
    <head>
        <title>Log-in to Supernova BNB</title>
        {% include "components/import_stylesheets.html" %}
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
    {% include "components/nav.html" %}
        <div class="container">
            <h1>Log-in to an account</h1>
        
            <form method="POST" action="/login" class="form" id="login">
                <label for="email">Email</label>
                <input type="text" name="email" placeholder="Email" value="{{ email or '' }}" required><br>

                <label for="password">Password</label>
                <input type="password" name="password" placeholder="Password" required><br>
            {% if error %}
                <p role="alert">{{ error }}</p>
            {% endif %}
                
                <button class="btn btn-primary" type="submit">Log-in</button>
            </form>

        </div>
        {% include "components/footer.html" %}
    </body>
</html>
