<html>
    <head>
        <title>Log-in to Supernova BNB</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
    {% include "components/nav.html" %}
        <div>
            <h1 style="margin-left: 30vw;">Log-in to an account</h1>
        </div>
        <div>
            <form method="POST" action="/login" class="login_form">
                <label for="email">Email</label>
                <input type="text" name="email" placeholder="Email" value="{{ email or '' }}" required><br>

                <label for="password">Password</label>
                <input type="text" name="password" placeholder="Password" required><br>
                
                <button class="btn-secondary" type="submit">Log-in</button>
            </form>
            {% if error %}
                <p role="alert">{{ error }}</p>
            {% endif %}
        </div>
        {% include "components/footer.html" %}
    </body>
</html>
