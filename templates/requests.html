<!DOCTYPE html>
<html>
    <head>
        <title>SupernovaBnB - Spaces</title>

        <link rel="stylesheet" href="/static/style.css" >
    </head>
    <body>
        {% include "components/nav.html" %}
        <h2>My Spaces - Bookings</h2>
        {% for booking in bookings %}
        <article class="booking-card">
            <h3>Booking Id: <span class="booking-id">{{ booking.id }}</span></h3>
            <p>Space Id: {{ booking.space_id }}</p>
            <p>Booked By: {{ booking.booked_by }}</p>
            <p>Date Requested: {{ booking.date }}</p>
        <div class="booking-actions">
            <form action="/my_spaces/requests/{{ booking.id }}/accept" method="POST">
                <button type="submit" class="btn btn-accept">Accept</button>
            </form>

            <form action="/my_spaces/requests/{{ booking.id }}/deny" method="POST">
                <button type="submit" class="btn btn-deny">Deny</button>
            </form>
        </div>
        </article>
        {% else %}
        <p>You have no booking requests right now</p>
        {% endfor %}
    </body>
</html>
