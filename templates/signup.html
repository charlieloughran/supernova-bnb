<html>
    <head>
        <title>Sign-up to Supernova BNB</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
    {% include "components/nav.html" %}

        <div>
            <h1 style="margin-left: 30vw;">Create an account</h1>
        </div>
        <div>
            <form method="POST" action="/register" class="login_form">
                <label for="email">Name</label>
                <input type="text" name="name" placeholder="Name" value="{{ name or '' }}" required><br>

                <label for="email">Email</label>
                <input type="text" name="email" placeholder="Email" value="{{ email or '' }}" required><br>

                <label for="password">Password</label>
                <input type="text" name="password" placeholder="Password" required><br>
                
                <button type="submit" class="btn-secondary">Sign-up</button>
            </form>
            {% if error %}
                <p role="alert">
                    {{ error }}
                    <a href="/login/new">Log-in instead</a>
                </p>
            {% endif %}
        </div>
        {% include "components/footer.html" %}
    </body>
</html>
