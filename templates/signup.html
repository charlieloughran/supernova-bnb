<html>
    <head>
        <title>Sign-up to Supernova BNB</title>
        <link rel="stylesheet" href="/static/style.css">
        {% include "components/import_stylesheets.html" %}

    </head>
    <body>
    {% include "components/nav.html" %}

        <div class="container">
            <h1>Create an account</h1>

            <form method="POST" action="/register" class="form" id="signup">
                <label for="email">Name</label>
                <input type="text" name="name" placeholder="Name" value="{{ name or '' }}" required><br>

                <label for="email">Email</label>
                <input type="text" name="email" placeholder="Email" value="{{ email or '' }}" required><br>

                <label for="password">Password</label>
                <input type="password" name="password" placeholder="Password" required><br>

                {% if error %}
                <p role="alert">
                {{ error }}
                    <a href="/login/new">Log-in instead</a>
                </p>
            {% endif %}


                <button type="submit" class="btn btn-primary">Sign-up</button>
            </form>

        </div>
        {% include "components/footer.html" %}
    </body>
</html>
