<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve your space</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    {% include 'components/nav.html' %}
    <section>
        <img src={{ space.image_url }}>
        <h2>{{ space.name }}</h2>
        <h3>{{ space.description }}</h3>
    </section>

    <section>
        <h2>Reserve your space</h2>
        <h1>£{{ space.price_per_night }}</h1>
        <form method="POST" action="/spaces/{{ space.id }}/book">
            <label for="booking_date">Select date:</label>
            <input 
                type="date" 
                id="booking_date" 
                name="booking_date"
                min="{{ space.availability_start_date.strftime('%Y-%m-%d') }}"
                max="{{ space.availability_end_date.strftime('%Y-%m-%d') }}"
                required
            >
            <p id="date_error" style="color: #d9534f; display: none;">
                Sorry, this date is already booked. Please select another date.
            </p>
            <input type="submit" value="Book">
        </form>
        <script>

            const bookedDates = {{ booked_dates | tojson }};

            const datePicker = document.getElementById("booking_date");
            const dateError = document.getElementById("date_error");

            datePicker.addEventListener("input", function() {

                if (bookedDates.includes(this.value)) {

                    dateError.style.display = "block";
                    this.value = "";

                } else {

                    dateError.style.display = "none";

                }

            });

        </script>
    </section>
</body>
</html>
